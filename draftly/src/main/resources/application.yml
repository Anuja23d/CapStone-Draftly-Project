spring:
  datasource:
    url: jdbc:mysql://localhost:3306/draftly
    username: ${user}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${client_id}
            client-secret: ${client_secret}
            scope:
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
              - https://www.googleapis.com/auth/gmail.send
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo


  ai:
    openai:
      api-key: ${api_key}
      # Your key is an OpenRouter key (sk-or-...), so use OpenRouter's OpenAI-compatible endpoint.
      # Important: Spring AI appends /v1/chat/completions by default, so base-url must NOT already end with /v1.
      base-url: https://openrouter.ai/api
      chat:
        base-url: https://openrouter.ai/api
        options:
          # OpenRouter models are usually namespaced.
          model: openai/gpt-4o-mini
          temperature: 0.7
          # Optional but recommended for OpenRouter.
          http-headers:
            HTTP-Referer: http://localhost:8080
            X-Title: Draftly
